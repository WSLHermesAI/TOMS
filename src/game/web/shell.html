<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tower of the Sorcerer</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05050a; }
    /* The page sizes the canvas (full viewport) and SDL follows it: SDL sees an externally sized
       canvas and sets its drawing buffer to this CSS size x devicePixelRatio. Without a CSS size,
       SDL's probe misreads a 1 px canvas at fractional display scaling (e.g. 240%) and the canvas
       stayed 1x1 -- a black page. The game letterboxes its 1024x768 image inside. */
    #canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
              display: block; touch-action: none; outline: none; }
    #toms-status { position: fixed; left: 0; right: 0; top: 45%; text-align: center; color: #f2e6c8;
                   font: 600 18px/1.6 system-ui, -apple-system, "Microsoft JhengHei", sans-serif; pointer-events: none; }
    #toms-error { display: none; position: fixed; left: 8%; right: 8%; top: 20%; padding: 20px; z-index: 100;
                  background: #1b1020; color: #ffd9d9; border: 1px solid #a05; border-radius: 8px;
                  font: 15px/1.6 system-ui, sans-serif; white-space: pre-wrap; }
    #toms-rotate { display: none; position: fixed; inset: 0; z-index: 99; background: #0b0e16; color: #f2e6c8;
                   align-items: center; justify-content: center; text-align: center; padding: 24px;
                   font: 600 20px/1.6 system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="toms-status">Loading…</div>
  <div id="toms-error"></div>
  <div id="toms-rotate">請把裝置轉為橫向 · Rotate your device</div>
  <script>
    function tomsShowError(title, text) {
      var e = document.getElementById('toms-error');
      e.textContent = title + '\n\n' + text + '\n\nOpen the browser console (F12) for details.';
      e.style.display = 'block';
      document.getElementById('toms-status').style.display = 'none';
    }
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      setStatus: function (t) {
        var s = document.getElementById('toms-status');
        if (!t) { s.style.display = 'none'; return; }
        // "Downloading data... (1234/5678)" -> a percentage
        var m = t.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
        s.textContent = m ? 'Loading… ' + Math.round(100 * m[1] / m[3]) + '%' : t;
      },
      // Calling into C++ (Module.ccall) before this point aborts debug builds, so page code and
      // tests check window.tomsReady first.
      onRuntimeInitialized: function () { window.tomsReady = true; document.getElementById('toms-status').style.display = 'none'; },
      onAbort: function (what) { tomsShowError('The game stopped', String(what || 'unknown error')); }
    };
    window.onerror = function (msg) { tomsShowError('Script error', String(msg)); };

    // Portrait phones: ask for landscape (the game is 4:3).
    function tomsRotateHint() {
      var portrait = window.innerHeight > window.innerWidth && ('ontouchstart' in window);
      document.getElementById('toms-rotate').style.display = portrait ? 'flex' : 'none';
    }
    window.addEventListener('resize', tomsRotateHint);
    window.addEventListener('orientationchange', tomsRotateHint);
    tomsRotateHint();

    // The game has no buttons on this page: everything is in its own menu (≡ / Esc), including
    // Fullscreen (System tab). The game calls this a frame after the click; the click's user
    // activation still holds then. Where a browser refuses anyway, the next tap or key does it.
    var tomsFullscreenPending = false;
    function tomsFullscreenNow() {
      var d = document.documentElement;
      var on = document.fullscreenElement || document.webkitFullscreenElement;
      var f = on ? (document.exitFullscreen || document.webkitExitFullscreen) : (d.requestFullscreen || d.webkitRequestFullscreen);
      if (!f) return Promise.resolve();
      try { return Promise.resolve(f.call(on ? document : d)); } catch (e) { return Promise.reject(e); }
    }
    window.tomsToggleFullscreen = function () {
      tomsFullscreenNow().catch(function () { tomsFullscreenPending = true; });
    };
    function tomsFullscreenRetry() {
      if (!tomsFullscreenPending) return;
      tomsFullscreenPending = false;
      tomsFullscreenNow().catch(function () {});
    }
    document.addEventListener('pointerup', tomsFullscreenRetry, true);
    document.addEventListener('keydown', tomsFullscreenRetry, true);
  </script>
  {{{ SCRIPT }}}
</body>
</html>
