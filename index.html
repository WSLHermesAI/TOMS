<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tower of the Sorcerer</title>
<!--
  clear.html — the clean, hand-maintained game page for the TOMS browser build.

  This file is SOURCE, not a build artifact: build_web.sh regenerates
  toms_web.js / .wasm / .data on every build but never touches this page, and it copies
  this file into the build output as index.html (with the build stamp filled in). So a clean
  page always survives a rebuild — nothing here comes from the Emscripten shell.

  It deliberately contains none of the default Emscripten shell chrome: no logo, no
  spinner/status/progress block, and no #output debug console. Errors still go to the
  browser console (F12), just not into the page.
-->
<style>
  html, body { margin: 0; height: 100%; background: #05050a; overflow: hidden; }
  /* The canvas keeps its 1024x768 drawing buffer; the page just centres it and the game's
     own inline script scales the CSS box to fit the viewport. */
  canvas {
    display: block;
    margin: 0 auto;
    border: 0;
    background: #05050a;
    touch-action: none;           /* no browser pan/zoom gestures over the game */
    outline: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    color: #8d93a8; font: 15px/1.5 system-ui, sans-serif; letter-spacing: .10em;
    background: radial-gradient(ellipse at 50% 38%, #0d1020 0%, #05050a 70%);
    transition: opacity .45s ease; pointer-events: none; z-index: 5;
  }
  #boot.hidden { opacity: 0; }
  #boot .brand {
    color: #f2d07a; font-size: 26px; letter-spacing: .34em; text-indent: .34em;
    animation: breathe 2.6s ease-in-out infinite;      /* never looks frozen, even at 0% */
  }
  #boot .sub { color: #6c7290; font-size: 13px; letter-spacing: .5em; text-indent: .5em; margin-top: -14px; }
  #boot .track {
    width: min(340px, 62vw); height: 4px; border-radius: 3px; overflow: hidden;
    background: #191d2c; box-shadow: inset 0 0 0 1px #232838;
  }
  #boot .fill {
    width: 2%; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #8a6a24, #f2d07a);
    transition: width .18s linear;
  }
  #boot .shimmer {
    /* a travelling highlight riding on the bar so progress is visibly alive between updates */
    position: relative; top: -4px; height: 4px; width: 90px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    animation: slide 1.15s linear infinite; margin-left: -90px;
  }
  #boot .status { color: #9aa1bb; font-size: 13px; letter-spacing: .06em; min-height: 1.2em; }
  #boot .pct { color: #f2d07a; font-size: 13px; letter-spacing: .12em; }
  #boot.failed .status { color: #ff9c9c; }
  @keyframes breathe { 0%,100% { opacity: .58 } 50% { opacity: 1 } }
  @keyframes slide {
    0%   { transform: translateX(0) }
    100% { transform: translateX(min(340px, 62vw)) }
  }
  @media (prefers-reduced-motion: reduce) {
    #boot .brand, #boot .shimmer { animation: none }
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="boot">
  <div class="brand">TOWER OF THE SORCERER</div>
  <div class="sub">魔法塔</div>
  <div class="track"><div class="fill" id="bootFill"></div><div class="shimmer"></div></div>
  <div class="pct" id="bootPct">0%</div>
  <div class="status" id="bootStatus">正在載入…</div>
</div>

<script>
  // Must exist before the module script runs (the standard Emscripten embedding contract):
  // the runtime uses this canvas instead of creating/looking one up of its own.
  window.TOMS_VERSION = '61893de-20260910234751';   // filled in by build_web.sh
  var Module = {
    canvas: document.getElementById('canvas'),
    arguments: []
  };

  // ---- loading feedback ---------------------------------------------------------------------
  // The .data bundle is ~17 MB, so without something moving on screen the page looks crashed.
  // The Emscripten loader reports real progress through Module.setStatus
  // ("Downloading data... (<loaded>/<total>)"), which is mapped onto the bar; a slow "creep"
  // keeps the bar advancing between reports and a CSS shimmer keeps it visibly alive even if a
  // single fetch stalls for a while. The overlay fades out once the runtime is up (i.e. when the
  // game's own title screen starts drawing).
  (function () {
    var boot = document.getElementById('boot');
    var fill = document.getElementById('bootFill');
    var pctEl = document.getElementById('bootPct');
    var statusEl = document.getElementById('bootStatus');
    var pct = 2, done = false;

    function paint() {
      fill.style.width = pct.toFixed(1) + '%';
      pctEl.textContent = (pct >= 99.95 ? 100 : Math.floor(pct)) + '%';
    }
    function say(text) { if (text) statusEl.textContent = text; }
    paint();

    var creep = setInterval(function () {
      if (done) return;
      var cap = pct < 70 ? 70 : 97;                  // never claims to be finished before it is
      pct = Math.min(cap, pct + Math.max(0.12, (cap - pct) * 0.010));
      paint();
    }, 120);

    Module.setStatus = function (text) {
      if (!text) return;
      var m = /\((\d+)\s*\/\s*(\d+)\)/.exec(text);
      if (m) {
        var loaded = +m[1], total = +m[2];
        if (total > 0) pct = Math.max(pct, 4 + 90 * (loaded / total));
        say('下載遊戲資料… ' + Math.round(loaded / 1048576) + ' / ' + Math.round(total / 1048576) + ' MB');
      } else if (/Downloading data/i.test(text)) {
        pct = Math.max(pct, 4);
        say('下載遊戲資料…');
      } else if (/Running/i.test(text)) {
        pct = Math.max(pct, 94);
        say('啟動引擎…');
      } else if (/preparing|compil/i.test(text)) {
        say('準備中…');
      }
      paint();
    };
    Module.monitorRunDependencies = function (n) {
      if (n > 0 && pct < 94) say('準備中…');
    };
    Module.onRuntimeInitialized = function () {
      done = true;
      clearInterval(creep);
      pct = 100; paint(); say('完成');
      boot.classList.add('hidden');
      setTimeout(function () { boot.style.display = 'none'; }, 900);
    };
    // A genuine failure should say so instead of leaving a frozen 97% on screen.
    window.addEventListener('error', function () {
      if (done) return;
      boot.classList.add('failed');
      statusEl.textContent = '載入失敗，請重新載入頁面（或按 Ctrl+Shift+R）';
    });
  })();
</script>
<!-- 61893de-20260910234751 is the build stamp (e.g. "7a99211-20260910224510"). build_web.sh names the
     artifacts after it (toms_web.<stamp>.js/.wasm/.data) and fills the stamp in here, so the
     filename itself busts the cache -- a returning visitor can never mix a new page with old
     binaries. -->
<script src="toms_web.61893de-20260910234751.js"></script>
</body>
</html>
