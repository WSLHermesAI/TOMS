<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Editor Tutorial</title>
<link rel="stylesheet" href="style.css">
<style>
  .menubar .edtitle { padding: 3px 9px; color: var(--text); }
  .menubar #dirtyMark { padding: 3px 0; }
  .steps { width: 340px; }
  .steps.collapsed { display: none; }
  .steps h3 { display: flex; align-items: center; gap: 6px; }
  .steps h3 .grow { flex: 1; }
  .steps h3 button { padding: 0 7px; font-size: 11px; text-transform: none; letter-spacing: 0; }
  #tutBtn.on { background: #2d5d9a; border-color: #3b74bd; }
  .steps .body { padding-top: 6px; }
  .part { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; margin: 10px 0 5px; text-transform: uppercase; }
  .step { border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; margin-bottom: 6px; background: var(--panel-2); opacity: .5; }
  .step.cur { opacity: 1; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .step.done { opacity: .8; border-color: #2f6b4b; }
  .step.playing { animation: pulse 1s ease infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 0 3px var(--accent) inset; } }
  .step h4 { margin: 0; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .step .num { width: 20px; height: 20px; border-radius: 50%; background: var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
  .step.cur .num { background: var(--accent); color: #fff; }
  .step.done .num { background: var(--ok); color: #111; }
  .step p { margin: 6px 0 2px; }
  .step .why { color: var(--muted); font-size: 12px; }
  .step .actions { margin-top: 6px; }
  .step code, .modal code, .insp code { background: #111317; padding: 0 4px; border-radius: 3px; }
  .playbar { display: flex; gap: 6px; margin-bottom: 4px; }
  .playbar button { flex: 1; }
  .finish { border: 1px solid var(--ok); border-radius: 5px; padding: 10px; background: #1f3a2c; margin-top: 8px; }

  .work { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .top { flex: 1 1 52%; display: flex; min-height: 0; border-bottom: 1px solid var(--line); }
  .bottom { flex: 1 1 48%; display: flex; flex-direction: column; min-height: 0; }
  .tree li.pool { display: flex; justify-content: space-between; align-items: center; }
  .tree li.pool button { padding: 0 6px; font-size: 11px; }
  .tree li.ghost { padding-left: 16px; color: #ff9b9b; }
  .filt { margin-bottom: 6px; }
  .filt input[type=search] { width: 100%; }
  .filtrow { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; }
  .filtrow select { flex: 1; min-width: 0; font-size: 12px; }
  .filtrow label { white-space: nowrap; color: var(--muted); }
  .fcount { color: var(--muted); font-size: 11px; margin-top: 3px; min-height: 14px; }
  .fcount button { padding: 0 5px; font-size: 11px; margin-left: 4px; }
  .treebar { display: flex; gap: 4px; margin-top: 3px; }
  .treebar button { flex: 1; padding: 0 4px; font-size: 11px; color: var(--muted); }
  .tree li.grp { cursor: pointer; user-select: none; }
  .tree li.grp:hover { background: var(--panel-2); }
  .tree .cnt { color: var(--muted); font-weight: normal; font-size: 11px; }
  .tree mark { background: #ffd24c; color: #1b1b1b; border-radius: 2px; padding: 0 1px; }
  .tree .hit { display: block; color: var(--muted); font-size: 11px; padding-left: 14px; overflow: hidden; text-overflow: ellipsis; }
  .tree .new { color: var(--ok); font-size: 10px; font-weight: 700; margin-left: 4px; }
  .insp { padding: 12px 18px; max-width: 780px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .err { color: var(--bad); font-size: 12px; margin-top: 2px; }
  .lang { display: grid; grid-template-columns: 54px 1fr; gap: 6px; align-items: start; margin-bottom: 4px; }
  .lang span { color: var(--muted); padding-top: 4px; }
  .preview { background: #0d0f12; border: 2px solid #6b5a3a; border-radius: 6px; padding: 10px 14px; color: #f3e6c8; font-size: 15px; min-height: 44px; }
  .preview small { display: block; color: #a89a7c; font-size: 11px; white-space: normal; }
  .preview { white-space: pre-line; }   /* Enter in a text box = a new line (\n), shown as one here */
  .lang textarea { overflow: hidden; }
  .nlhint { color: var(--muted); font-size: 11px; font-weight: normal; margin-left: 6px; }
  .banner-bad { border: 1px solid #6b2a2a; background: #3a1b1b; border-radius: 5px; padding: 10px 12px; margin-bottom: 10px; }
  .banner-warn { border: 1px solid #6a5420; background: #3a2f14; border-radius: 5px; padding: 8px 12px; margin-bottom: 10px; color: #ffd98a; }
  .popover { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px; box-shadow: 0 6px 20px #000a; z-index: 5; width: 470px; }
  .popover .act { margin: 6px 0 2px; color: var(--muted); font-size: 11px; }
  .popover .grid { display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .popover .scroll { max-height: 230px; overflow: auto; }
  .empty { padding: 26px; color: var(--muted); }

  .dhead { display: flex; gap: 8px; align-items: center; padding: 5px 10px; background: var(--panel-2); border-bottom: 1px solid var(--line); flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  .dhead > * { flex-shrink: 0; } .dhead #dinfo { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg button.on { background: #2d5d9a; border-color: #3b74bd; }
  .tabs2 button { font-weight: 600; }
  .dhead .grow { flex: 1; }
  #pane { flex: 1; overflow: auto; position: relative; }
  .node rect { stroke-width: 1.5; }
  .node text { font-size: 12px; fill: #fff; pointer-events: none; }
  .node { cursor: pointer; }
  .node.faded { opacity: .33; }
  .node.hl rect.box { stroke: #fff; stroke-width: 2.5; }
  .node.isnew rect.box { filter: drop-shadow(0 0 6px #4cd18a); }
  .edge { fill: none; stroke: #5d6570; stroke-width: 1.2; }
  .edge.faded { opacity: .18; }
  .edge.hl { stroke: #fff; stroke-width: 2; }
  .edge.miss { stroke: var(--bad); stroke-dasharray: 5 3; }
  .edge.fresh { stroke: var(--ok); stroke-width: 2.5; stroke-dasharray: 600; stroke-dashoffset: 600; animation: grow 1.1s ease forwards; }
  @keyframes grow { to { stroke-dashoffset: 0; } }
  .colhead { fill: var(--muted); font-size: 11px; letter-spacing: .05em; }
  .note { fill: var(--bad); font-size: 12px; }

  .plist { padding: 8px 12px; }
  .batch { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .batch .chap { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 8px; }
  .rulechips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .rulechip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 1px 10px; cursor: pointer; font-size: 12px; }
  .rulechip.on { border-color: var(--accent); background: #24395a; }
  .sev-error { color: var(--bad); } .sev-warn { color: var(--warn); } .sev-info { color: var(--muted); }
  td.fix { text-align: right; white-space: nowrap; }
  td.where { color: var(--muted); font-size: 12px; }

  .modal-bg { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; width: min(920px, 94vw); max-height: 86vh; display: flex; flex-direction: column; }
  .modal header, .modal footer { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .modal footer { border-top: 1px solid var(--line); border-bottom: none; text-align: right; }
  .modal .content { overflow: auto; padding: 10px 14px; }
  .file { margin-bottom: 14px; }
  .file .path { font-weight: 600; margin-bottom: 4px; }
  pre.diff { margin: 0; background: #111317; border: 1px solid var(--line); border-radius: 4px; padding: 8px; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; overflow: auto; max-height: 260px; }
  pre.diff .add { color: #7ee2a8; background: #173323; display: block; }
  pre.diff .del { color: #ff9b9b; background: #3a1b1b; display: block; }
  pre.diff .ctx { color: #8b929c; display: block; }
  .flash { animation: flash 1.2s ease 2; }

  /* floor map + floor inspector */
  .fnode rect { stroke-width: 1.5; }
  .fnode text { font-size: 12px; fill: #fff; pointer-events: none; }
  .fnode { cursor: pointer; }
  .fnode.faded { opacity: .35; }
  .fnode.hl rect { stroke: #fff; stroke-width: 2.5; }
  .fnode.isnew rect { filter: drop-shadow(0 0 6px #4cd18a); }
  .stair { fill: none; stroke: #6b7380; stroke-width: 1.3; }
  .stair.faded { opacity: .15; }
  .stair.hl { stroke: #fff; stroke-width: 2.2; }
  .stair.lock { stroke: #e0b44c; stroke-dasharray: 6 4; stroke-width: 2; }
  .stair.miss { stroke: var(--bad); stroke-dasharray: 5 3; }
  .stair.fresh { stroke: var(--ok); stroke-width: 2.5; }
  .locklbl { font-size: 11px; fill: #e0b44c; }
  .rowlbl { fill: var(--muted); font-size: 11px; }
  table.stairs { width: auto; margin-bottom: 6px; }
  table.stairs td { border: none; padding: 2px 6px 2px 0; }
  table.stairs input.stTo { width: 80px; }
  table.stairs select.stUnlock { max-width: 300px; }
  tr.sterr td { color: var(--bad); font-size: 12px; padding-bottom: 6px; }
  .chip.link { cursor: pointer; }
  .chip.kpick { cursor: pointer; gap: 4px; display: inline-flex; align-items: center; margin: 1px 0; }
  .chip.kpick input { margin: 0; } .chip.kpick.on { border-color: var(--accent); background: rgba(90,150,255,.16); }
  .chip.kpick .kgo { color: var(--muted); padding: 0 2px; } .chip.kpick .kgo:hover { color: var(--accent); }
  .kmove { white-space: nowrap; } .kmove select { margin-top: 4px; }
  button.link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0 4px; }
  .chip.link:hover { border-color: var(--accent); }
  .chip.bad { border-color: var(--bad); color: #ff9b9b; }

  /* event logic */
  .logic { border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; margin-bottom: 10px; background: #202328; }
  .logic h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .lrow { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .lrow select, .lrow input { font-size: 12px; }
  .lrow input[type=number] { width: 64px; }
  .lrow .lbl { color: var(--muted); font-size: 12px; min-width: 120px; }
  .lrow button.del { padding: 0 6px; }
  .rawjson { font: 11px Consolas, monospace; background: #111317; border: 1px solid var(--line); border-radius: 3px; padding: 4px; white-space: pre-wrap; }
  table.vars td, table.vars th { font-size: 12px; }
  table.vars input[type=number] { width: 64px; }
  .vsec { margin: 10px 0 4px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .lnode { cursor: pointer; }
  .lnode text { font-size: 12px; fill: #fff; pointer-events: none; }
  .lnode.faded { opacity: .3; }
  .lnode.hl rect { stroke: #fff; stroke-width: 2.5; }
  .ledge { fill: none; stroke-width: 1.6; }
  .ledge.faded { opacity: .15; }
  .ledge.next { stroke: var(--ok); }
  .ledge.sets { stroke: #4c9eff; }
  .ledge.reads { stroke: #a98bff; stroke-dasharray: 5 4; }
  .ledge.talk { stroke: #ff9f43; }
  .ledge.watch { stroke: #a98bff; stroke-dasharray: 2 3; }
  .elbl { font-size: 11px; fill: #c7ccd4; }

  /* node graph, after thedmd/imgui-node-editor's blueprint style: headers, pins, bezier links, flow */
  .ne { position: absolute; inset: 0; overflow: hidden; background-color: #1a1c20; user-select: none; cursor: default;
    background-image: linear-gradient(#2b2e35 1px, transparent 1px), linear-gradient(90deg, #2b2e35 1px, transparent 1px),
      linear-gradient(#222429 1px, transparent 1px), linear-gradient(90deg, #222429 1px, transparent 1px); }
  .ne.panning { cursor: grabbing; }
  .ne-c { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .ne-links { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  .nl { fill: none; stroke-width: 2.2; }
  .nl.flow { stroke: #e8eaee; stroke-width: 3; }
  .nl.sel { stroke: #ffd24c !important; stroke-width: 3.5; }
  .nl.flowing { stroke-dasharray: 10 7; animation: neflow .55s linear infinite; }
  @keyframes neflow { to { stroke-dashoffset: -17; } }
  .nl.temp { stroke-dasharray: 6 4; opacity: .9; }
  .nlh { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  .nn { position: absolute; min-width: 190px; background: rgba(30,32,38,.95); border: 1px solid #4a505a; border-radius: 9px; box-shadow: 0 4px 14px #000a; font-size: 12px; }
  .nn.sel { border-color: #ffd24c; box-shadow: 0 0 0 2px #ffd24c66, 0 4px 14px #000a; }
  .nn.missing { border-color: var(--bad); }
  .nh { padding: 4px 10px 5px; border-radius: 8px 8px 0 0; color: #fff; cursor: move; display: flex; flex-direction: column;
    background: linear-gradient(90deg, color-mix(in srgb, var(--hc) 80%, transparent) 0%, color-mix(in srgb, var(--hc) 25%, transparent) 100%); }
  .nt { font-weight: 700; text-shadow: 0 1px 2px #000; }
  .ns { font-size: 10.5px; opacity: .85; }
  .nb { display: flex; justify-content: space-between; gap: 18px; padding: 6px 0 7px; }
  .nins, .nouts { display: flex; flex-direction: column; gap: 3px; }
  .pin { display: flex; align-items: center; gap: 6px; padding: 1px 9px; cursor: crosshair; white-space: nowrap; color: #d7dbe0; }
  .pin.out { flex-direction: row-reverse; }
  .pin:hover .pd { transform: scale(1.35); }
  .pd { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--pc); flex: none; box-sizing: border-box; }
  .pin.on .pd { background: var(--pc); }
  .pin.flow .pd { border: none; border-radius: 0; width: 11px; height: 12px; background: #8b929c; clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%); }
  .pin.flow.on .pd { background: #fff; }
  .pin.ghost { opacity: .55; font-style: italic; }
  .pin.ok .pd { box-shadow: 0 0 0 4px #4cd18a88; } .pin.ok { color: #7ee2a8; }
  .pin.no { opacity: .22; }
  .ne-hint { position: absolute; left: 8px; bottom: 6px; color: var(--muted); font-size: 11px; pointer-events: none; background: #000a; padding: 2px 7px; border-radius: 3px; }
  .ne-empty { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); color: var(--muted); pointer-events: none; text-align: center; max-width: 420px; }
  .ne-box { position: absolute; border: 1px solid #4c9eff; background: #4c9eff22; pointer-events: none; }
  .ne-menu { position: absolute; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px #000b; width: 270px; max-height: 330px; display: flex; flex-direction: column; }
  .ne-menu input { margin: 6px; }
  .ne-menu .ml { overflow: auto; padding-bottom: 4px; }
  .ne-menu .mg { color: var(--muted); font-size: 10.5px; padding: 5px 9px 2px; text-transform: uppercase; }
  .ne-menu .mi { padding: 3px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ne-menu .mi:hover { background: #2d4a70; }
  /* values map + value tabs */
  .vmap { position: relative; }
  .vtool { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  .vtool input[type=search] { width: 220px; }
  .vtool .vchip { border: 1px solid var(--line); border-radius: 12px; padding: 1px 9px; cursor: pointer; font-size: 12px; background: var(--panel-2); }
  .vtool .vchip.on { border-color: var(--accent); background: #24395a; }
  .vnode { cursor: pointer; }
  .vnode text { font-size: 12px; fill: #fff; pointer-events: none; }
  .vnode .badge { font-size: 10.5px; fill: #c7ccd4; }
  .vnode.faded, .vedge.faded { opacity: .15; }
  .vnode.hl rect { stroke: #fff; stroke-width: 2.4; }
  .vedge { fill: none; stroke-width: 1.6; }
  .vedge.w { stroke: #4c9eff; } .vedge.r { stroke: #a98bff; stroke-dasharray: 5 4; } .vedge.c { stroke: #a98bff; stroke-dasharray: 2 3; }
  .vcol { fill: var(--muted); font-size: 11px; letter-spacing: .05em; }
  .vcat { fill: #e0b44c; font-size: 11px; font-weight: 700; }
  tr.cathead td { background: #2a2620; color: #e8d9b0; cursor: pointer; padding-top: 5px; padding-bottom: 5px; }
  tr.cathead button { padding: 0 6px; font-size: 11px; margin-left: 6px; }
  input.vCat { font-size: 12px; }
  #vtip { position: fixed; z-index: 60; pointer-events: none; display: none; background: #0f1114f2; border: 1px solid #4a505a; border-radius: 5px; padding: 7px 10px;
    font-size: 12px; max-width: 360px; box-shadow: 0 6px 18px #000b; color: var(--text); }
  #vtip b { color: #fff; } #vtip .row { margin-top: 3px; } #vtip .muted { color: var(--muted); }
  .vtab { display: inline-flex; gap: 6px; align-items: center; }
  .vtab .x { opacity: .6; padding: 0 2px; border-radius: 3px; } .vtab .x:hover { opacity: 1; background: #ffffff22; }
  .vt { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 14px; padding: 10px 14px; }
  .vt h2 { margin: 0 0 8px; font-size: 16px; }
  .vt .sec { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; margin: 10px 0 4px; }
  .vt .crow { display: flex; gap: 6px; align-items: center; margin: 2px 0; font-size: 12px; }
  .vt .crow .how { color: var(--muted); }
  .vt .mini { border: 1px solid var(--line); border-radius: 5px; background: #1a1c20; overflow: auto; margin-top: 6px; }
  .vt .actions2 { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  body.neMax .top { display: none; }
  body.neMax .bottom { flex: 1 1 100%; }

  /* Play demo: the spotlight frames the control the next action uses; the console narrates */
  #spot { position: fixed; z-index: 40; pointer-events: none; border: 2px solid #ffd24c; border-radius: 6px; display: none;
    box-shadow: 0 0 0 4px #ffd24c55, 0 0 0 9999px #00000070; transition: top .35s ease, left .35s ease, width .35s ease, height .35s ease; }
  #spot.go { animation: spotgo .45s ease 2; }
  @keyframes spotgo { 50% { box-shadow: 0 0 0 10px #ffd24c99, 0 0 0 9999px #00000070; } }
  #spotLabel { position: fixed; z-index: 41; pointer-events: none; display: none; background: #ffd24c; color: #1b1b1b; font-weight: 700;
    font-size: 12px; padding: 3px 9px; border-radius: 4px; white-space: nowrap; transition: top .35s ease, left .35s ease; }
  #console { position: fixed; z-index: 50; right: 14px; bottom: 30px; width: 480px; background: #0f1114f2; border: 1px solid #4a505a;
    border-radius: 6px; box-shadow: 0 8px 28px #000c; display: none; flex-direction: column; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; }
  #console header { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid #333840; font-family: inherit; color: #d7dbe0; }
  #console header .grow { flex: 1; }
  #console header button { padding: 0 7px; font-size: 11px; }
  #conNext { padding: 8px 10px; border-bottom: 1px solid #333840; color: #ffd24c; min-height: 40px; }
  #conNext .lbl { color: #8b929c; display: block; font-size: 11px; }
  #conNext .bar { height: 3px; background: #333840; margin-top: 6px; border-radius: 2px; overflow: hidden; }
  #conNext .bar i { display: block; height: 100%; width: 0; background: #ffd24c; }
  #conLog { max-height: 170px; overflow: auto; padding: 6px 10px; }
  #console.min #conLog { display: none; }
  .cl { white-space: pre-wrap; color: #8b929c; }
  .cl .t { color: #5d6570; }
  .cl.step { color: #4c9eff; font-weight: 700; margin-top: 4px; }
  .cl.next.cur { color: #ffd24c; }
  .cl.done { color: #7ee2a8; }
  .cl.warn { color: #ff9f43; }
  .cl .where { color: #a98bff; }
  .langpick { display: inline-flex; gap: 4px; align-items: center; }
  .langpick select { padding: 0 4px; font-size: 12px; background: #2a2412; color: #ffd98a; border-color: #5a4a20; }
  @keyframes flash { 50% { box-shadow: 0 0 0 3px var(--ok); } }
  .src { font-size: 12px; color: var(--muted); margin-left: 8px; white-space: nowrap; }
  tr.newvar td { background: var(--panel-2); border-bottom: 1px solid var(--line); }
  table.vars .vchk { width: 22px; padding-right: 0; } tr.vsel td { background: #1d3150; }
  tr.bulkbar td { background: #22324a; border-bottom: 1px solid var(--accent); position: sticky; top: 0; z-index: 2; }
  tr.justadded td { background: #1f3a2c; animation: justadded 2s ease 1; }
  @keyframes justadded { from { background: #2f6b4b; } }
  .src.live { color: var(--ok); }
  body.live .banner { background: #12301f; color: #9fe6bd; border-color: #1f5a37; }

// ---------- event logic (06_EVENT_LOGIC.md): trigger, requires (rows ANDed), actions, next ----------
// requires is kept in the game's condition format (condition.cpp); the editor shows a leaf or an "all" of leaves as rows.
function logicFrom(e) {
  const rq = e.requires; let req = [], reqRaw = null;

  return { trigger: e.trigger || { on: 'step' }, req: JSON.parse(JSON.stringify(req)), reqRaw, actions: JSON.parse(JSON.stringify(e.actions || [])), next: [...(e.next || [])] };
}
const blankLogic = () => ({ trigger: { on: 'step' }, req: [], reqRaw: null, actions: [], next: [] });
const ITEMS = ['gem_atk', 'gem_def', 'potion_red', 'potion_blue', 'coin', 'scroll', 'exp_up'];
const hasLogic = e => e.trigger.on !== 'step' || e.req.length || e.reqRaw || e.actions.length || e.next.length;

let freshStairs = new Set();

  newCounter = 1; doneSet = new Set(); showInfo = false;

function clone(x) { return JSON.parse(JSON.stringify(x)); }
const ev = id => S.events.find(e => e.id === id);
const floorsOf = id => S.floors.filter(f => f.events.includes(id));
const tutEv = () => S.events.find(e => e.tutorial);

// which floors the player can reach from F01: open stairs always, locked ones once their event can be done on a reached floor
function reachable() {

  for (let changed = true; changed;) { changed = false;
    S.floors.filter(f => seen.has(f.id)).forEach(f => { f.events.forEach(e => done.add(e));
      f.stairs.forEach(st => { const lock = st.unlock && st.unlock.eventDone;
        if (st.to && flo(st.to) && !seen.has(st.to) && (!lock || done.has(lock))) { seen.add(st.to); changed = true; } }); }); }

const modelEdges = () => new Set([...S.floors.flatMap(f => f.events.map(id => f.id + '>' + id)), ...S.events.flatMap(e => [e.pool + '>' + e.id, e.id + '>' + e.text])]);
const strip = s => ({ pools: s.pools, events: s.events.map(({ isNew, tutorial, ...r }) => r), floors: s.floors.map(({ isNew, ...r }) => r), texts: s.texts, vars: s.vars, cats: s.cats, counters: s.counters, flags: s.flags, kinds: s.kinds });

// every edit snapshots first, so one Undo restores everything the edit touched (pool, floors, text)
function edit(label, fn) {

// ---------- problems: the validator, run after every edit ----------
const RULES = {
  missing_event: { sev: 'error', icon: '⛔' },   // names: rn(rule)
  missing_text:  { sev: 'error', icon: '⛔' },
  orphan:        { sev: 'warn',  icon: '⚠' },
  no_kind:       { sev: 'warn',  icon: '⚠' },
  placeholder:   { sev: 'warn',  icon: '⚠' },
  missing_floor: { sev: 'error', icon: '⛔' },
  bad_unlock:    { sev: 'error', icon: '⛔' },
  unreachable:   { sev: 'warn',  icon: '⚠' },
  unknown_kind:  { sev: 'warn',  icon: '⚠' },
  unknown_ref:   { sev: 'error', icon: '⛔' },
  bad_next:      { sev: 'error', icon: '⛔' },
  never_fires:   { sev: 'warn',  icon: '⚠' },
  never_active:  { sev: 'warn',  icon: '⚠' },
  logic_cycle:   { sev: 'warn',  icon: '⚠' },
  unused_var:    { sev: 'info',  icon: 'ⓘ' },
  untranslated:  { sev: 'info',  icon: 'ⓘ' },
};
function problems() {
  const out = [], seen = new Set();
  S.floors.forEach(f => f.events.forEach(id => { if (!ev(id) && !seen.has(id)) { seen.add(id);
    const fl = floorsOf(id); out.push({ rule: 'missing_event', id, where: fl.map(x => x.id).join(', '), act: fl[0].act }); } }));
  S.events.forEach(e => {
    const tx = S.texts[e.text], fl = floorsOf(e.id), act = actOfPool(e.pool);
    if (!fl.length && e.trigger.on === 'step') out.push({ rule: 'orphan', id: e.id, where: e.pool });   // a talk / variable / linked event needs no tile
    if (!tx) out.push({ rule: 'missing_text', id: e.id, where: e.text });
    else if (isPlaceholder(e.text, tx)) out.push({ rule: 'placeholder', id: e.id, where: e.text });
    else if (!tx.en || tx.en === tx.zh_TW) out.push({ rule: 'untranslated', id: e.id, where: e.text });
    if (!e.kind) out.push({ rule: 'no_kind', id: e.id, where: e.pool });
    else if (!S.kinds[e.kind]) out.push({ rule: 'unknown_kind', id: e.id, where: t('wUnknownKind', e.kind) });
  });
  // event logic: every reference must exist, every event must be able to fire, and links must not loop
  const linked = new Set(S.events.flatMap(e => e.next));
  const kindName = { var: t('grpVars'), counter: t('grpCounters'), flag: t('grpFlags'), event: t('grpEvents'), item: 'item' };
  S.events.forEach(e => {
    const refs = [...e.req.map(leafRef), ...e.actions.map(actRef), ...(e.trigger.on === 'varChanged' ? ['var:' + e.trigger.var] : [])].filter(Boolean);
    [...new Set(refs)].filter(r => !refExists(r)).forEach(r => out.push({ rule: 'unknown_ref', id: e.id, where: t('wUnknown', kindName[r.split(':')[0]], r.slice(r.indexOf(':') + 1)) }));
    e.next.filter(n => !ev(n)).forEach(n => out.push({ rule: 'bad_next', id: e.id, where: t('wBadNext', n) }));
    if (e.trigger.on === 'chain' && !linked.has(e.id)) out.push({ rule: 'never_fires', id: e.id, where: t('wNoIncoming') });
    if (e.trigger.on === 'talk' && !(DATA.npcs || {})[e.trigger.npc]) out.push({ rule: 'never_fires', id: e.id, where: t('wNpcNowhere', e.trigger.npc) });
    e.req.filter(l => l.type === 'varAtLeast' && S.vars[l.var] && !changers('var:' + l.var).length && (S.vars[l.var].default || 0) < l.value)
      .forEach(l => out.push({ rule: 'never_active', id: e.id, where: t('wNeverActive', l.var, l.value) }));
  });
  const onLoop = new Set();
  S.events.forEach(e0 => { const stack = [[e0.id, [e0.id]]], seen = new Set();
    while (stack.length) { const [id, path] = stack.pop(); const e = ev(id); if (!e) continue;
      e.next.forEach(n => { if (n === e0.id && !onLoop.has(e0.id)) { onLoop.add(e0.id); out.push({ rule: 'logic_cycle', id: e0.id, where: t('wCycle', [...path, n].join(' → ')) }); }
        else if (!seen.has(n)) { seen.add(n); stack.push([n, [...path, n]]); } }); } });
  Object.keys(S.vars).filter(v => !changers('var:' + v).length && !readers('var:' + v).length).forEach(v => out.push({ rule: 'unused_var', id: v, where: t('wUnusedVar') }));
  // floors: every stair must lead to a floor that exists, a lock must name a real event, and every floor must be reachable
  S.floors.forEach(f => f.stairs.forEach(st => {
    if (st.to && !flo(st.to)) out.push({ rule: 'missing_floor', id: f.id, to: st.to, where: t('stairWhere', f.id, st.dir, st.to) });
    const lock = st.unlock && st.unlock.eventDone;
    if (lock && !ev(lock)) out.push({ rule: 'bad_unlock', id: f.id, to: st.to, where: t('badUnlockWhere', f.id, st.to, lock) });
  }));
  const reach = reachable();
  S.floors.forEach(f => { if (!reach.has(f.id)) out.push({ rule: 'unreachable', id: f.id, where: t('unreachWhere') }); });
  return out;
}

// ---------- actions ----------
function guessKind(id) {

  return kindsList().find(k => id.includes(k.replace('memory_', ''))) || '';
}
function selectSubject(id, opts = {}) {

  if (mode === 'full') { const f = floorsOf(id)[0]; if (f && !actsInView().includes(f.act)) chapView = f.act; }
  if (opts.toDiagram) { if (isFloor(id)) tab = 'floors'; else { tab = 'diagram'; mode = 'focus'; } }   // coming from Problems: show just this case

}
function createEvent(pool) {

  let id; do { id = `ev_new_event_${newCounter++}`; } while (ev(id) || S.texts[id + '.text']);
  edit(t('hNew', id, pool), () => {
    const e = { id, kind: '', pool, text: id + '.text', isNew: true, ...blankLogic() };
    if (!tutEv()) e.tutorial = true;
    S.events.push(e); S.texts[e.text] = Object.fromEntries(LANGS.map(l => [l, ''])); selected = id;
  });

// Names (event ids, event variables, kinds, floors) may use any characters, Traditional Chinese included. Only characters
// that would break the editor's HTML (" ' < > &), its node graph (|) or a path (\ /) are refused; a floor name is also a
// file name (F01.json, 第一層.json), so : * ? are refused there too. No leading or trailing spaces.
const BAD_NAME = /["'<>&|\\\/\u0000-\u001f]/, BAD_FILE = /[:*?]/;
const nameOk = (s, file) => !!s && s === s.trim() && !BAD_NAME.test(s) && !(file && BAD_FILE.test(s));
function idError(id, self) {
  if (!nameOk(id)) return t('idFormat');

  return '';
}
function renameEvent(e, nu) {
  const old = e.id, touched = floorsOf(old);
  edit(t('hRename', old, nu), () => {
    touched.forEach(f => f.events[f.events.indexOf(old)] = nu);
    S.events.forEach(o => { o.next = o.next.map(x => x === old ? nu : x);
      o.req.forEach(l => { if (l.type === 'runFlagSet' && l.flag === 'event_' + old) l.flag = 'event_' + nu; }); });
    const tx = S.texts[e.text]; delete S.texts[e.text];
    e.id = nu; e.text = nu + '.text'; S.texts[e.text] = tx || {}; selected = nu;
  });
}
function addFloors(e, ids) { edit(t('hConnect', e.id, ids.join(', ')), () => ids.forEach(id => S.floors.find(f => f.id === id).events.push(e.id))); }
function setText(e, lang, value) { edit(t('hText', e.id, lang), () => { const tx = S.texts[e.text] = S.texts[e.text] || {}; tx[lang] = value; if (lang === 'zh_TW') delete tx._todo; }); }

// a missing id becomes a real event: ev_common_* variants go to pool_common, the rest to their chapter's pool.

function makeRecord(id, act) {
  const pool = id.startsWith('ev_common_') ? 'pool_common' : poolForAct(act);
  if (!S.pools.includes(pool)) S.pools.push(pool);
  const text = S.texts[id] ? id : id + '.text';
  if (!S.texts[text]) S.texts[text] = Object.fromEntries(LANGS.map(l => [l, '']));
  S.events.push({ id, kind: guessKind(id), pool, text, isNew: true, ...blankLogic() });
