<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOMS Stage Editor</title>
<style>
  :root {
    --bg: #1c1e22; --panel: #25282d; --panel-2: #2c3036; --line: #3a3f47; --text: #d7dbe0; --muted: #8b929c;
    --accent: #4c9eff; --warn: #ff9f43; --bad: #ff5d5d; --ok: #4cd18a;
    --k-relic: #e0b44c; --k-whisper: #a98bff; --k-cache: #3fc2b5; --k-trap: #ff6b6b; --k-rescue: #7bd86a;
    --k-merchant_echo: #ff8fc7; --k-memory_shard: #74c6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { overflow: hidden; }   /* the zoomed body fills the window; panels scroll, never the page */
  body { background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; }
  button, select, input { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 3px 7px; }
  button { cursor: pointer; } button:hover:not(:disabled) { border-color: var(--accent); } button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #2d5d9a; border-color: #3b74bd; }
  button.on { background: #2d5d9a; border-color: #3b74bd; }
  code { background: #111317; padding: 0 4px; border-radius: 3px; }

  .bar { display: flex; gap: 6px; align-items: center; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar .title { font-weight: 700; margin-right: 8px; }
  .bar .grow { flex: 1; }
  .bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .dirty { color: var(--warn); }
  .src { color: var(--muted); font-size: 12px; }
  .src.live { color: var(--ok); }

  .main { flex: 1; display: flex; min-height: 0; }
  .dock { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .dock.left { width: 270px; border-right: 1px solid var(--line); }
  .dock.right { width: 320px; border-left: 1px solid var(--line); }
  .dock h3 { margin: 0; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel-2);
    border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
  .dock h3 .grow { flex: 1; }
  .dock .body { overflow: auto; padding: 8px 10px; }
  .dock .body.grow { flex: 1; }

  /* palette */
  .pgroup { margin-bottom: 8px; }
  .pgroup > .ph { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; margin: 6px 0 4px; cursor: pointer; user-select: none; }
  .pgrid { display: flex; flex-wrap: wrap; gap: 4px; }
  .pitem { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 4px; background: #15171a; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .pitem:hover { border-color: var(--accent); }
  .pitem.sel { border-color: #ffd24c; box-shadow: 0 0 0 1px #ffd24c; }
  .pitem img, .pitem canvas { width: 32px; height: 32px; image-rendering: pixelated; }
  .pitem .ch { position: absolute; right: 2px; bottom: 0; font: 10px Consolas, monospace; color: var(--muted); }
  .evlist { list-style: none; margin: 0; padding: 0; }
  .evlist li { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .evlist li:hover { background: var(--panel-2); }
  .evlist li.sel { background: #3a3214; outline: 1px solid #ffd24c; }
  .evlist li .plate { width: 14px; height: 14px; flex: none; border-radius: 2px; background: #dbb85c; display: inline-flex; align-items: center; justify-content: center; }
  .evlist li .plate i { width: 7px; height: 7px; background: #475775; }
  .evlist li .k { color: var(--muted); font-size: 11px; }
  .evlist li .n { margin-left: auto; color: var(--muted); font-size: 11px; }
  .evlist li.bad { color: #ff9b9b; }
  .evlist li.placed .n { color: var(--ok); }
  #evSearch { width: 100%; margin-bottom: 4px; }

  /* canvas */
  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tools { display: flex; gap: 4px; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .tools .grow { flex: 1; }
  .brushInfo { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .brushInfo b { color: var(--text); }
  #wrap { flex: 1; overflow: auto; position: relative; background: #121316; }
  #cv { display: block; margin: 16px; image-rendering: pixelated; cursor: crosshair; }
  #wrap.panning, #wrap.panning #cv { cursor: grabbing; }
  #wrap.spacePan #cv { cursor: grab; }
  .bottom { height: 150px; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
  .bottom h3 { margin: 0; padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel-2); border-bottom: 1px solid var(--line); }
  #probs { overflow: auto; flex: 1; }
  #probs .pr { display: flex; gap: 8px; padding: 2px 10px; cursor: pointer; }
  #probs .pr:hover { background: var(--panel-2); }
  .sev-error { color: var(--bad); } .sev-warn { color: var(--warn); } .sev-info { color: var(--muted); }
  #probs .fix { margin-left: auto; padding: 0 6px; font-size: 11px; }

  /* inspector */
  .field { margin-bottom: 9px; }
  .field > label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .field input[type=text], .field input[type=number], .field select { width: 100%; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; font-size: 12px; cursor: pointer; }
  .chip.bad { border-color: var(--bad); color: #ff9b9b; }
  .chip.placed { border-color: #2f6b4b; }
  .txt { background: #0d0f12; border: 1px solid #6b5a3a; border-radius: 4px; padding: 6px 8px; color: #f3e6c8; white-space: pre-line; margin-top: 3px; }
  .muted { color: var(--muted); }
  .warnTag { color: var(--warn); }

  .statusbar { display: flex; gap: 16px; padding: 3px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
  .statusbar #hover { flex: 1; overflow: hidden; text-overflow: ellipsis; }

  .modal-bg { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; width: min(920px, 94vw); max-height: 86vh; display: flex; flex-direction: column; }
  .modal header, .modal footer { padding: 10px 14px; }
  .modal header { border-bottom: 1px solid var(--line); }
  .modal footer { border-top: 1px solid var(--line); display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
  .modal footer .grow { flex: 1; color: var(--muted); font-size: 12px; }
  .modal .content { overflow: auto; padding: 10px 14px; }
  .file { margin-bottom: 12px; }
  .file .path { font-weight: 600; margin-bottom: 4px; }
  pre.diff { margin: 0; background: #111317; border: 1px solid var(--line); border-radius: 4px; padding: 8px; font: 12px/1.45 Consolas, "Cascadia Mono", monospace; overflow: auto; max-height: 240px; }
  pre.diff .add { color: #7ee2a8; background: #173323; display: block; }
  pre.diff .del { color: #ff9b9b; background: #3a1b1b; display: block; }
  pre.diff .ctx { color: #8b929c; display: block; }
  .btabs { display: flex; gap: 2px; padding: 3px 8px 0; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .btabs button { border-radius: 4px 4px 0 0; border-bottom: none; font-size: 12px; }
  .btabs .grow { flex: 1; }
  table.story { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.story th, table.story td { text-align: left; padding: 2px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.story th { color: var(--muted); position: sticky; top: 0; background: var(--panel); }
  table.story tr.r { cursor: pointer; } table.story tr.r:hover { background: var(--panel-2); }
  table.story tr.cur { background: #2d4a70; }
  table.story td.iss { white-space: normal; }
  .ky { display: inline-block; min-width: 14px; padding: 0 4px; border-radius: 3px; color: #111; font-weight: 700; font-size: 11px; margin-right: 2px; text-align: center; }
  .ky.yellow { background: #e0c34c; } .ky.blue { background: #6aa8ff; } .ky.red { background: #ff7b7b; }
  #placeBar { display: none; gap: 8px; align-items: center; padding: 5px 10px; background: #1f3a2c; border-bottom: 1px solid #2f6b4b; flex-wrap: wrap; }
  #placeBar.on { display: flex; }
  #placeBar .grow { flex: 1; }
  .apPanel { position: absolute; z-index: 8; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px #000b; padding: 10px 12px; width: 340px; display: none; }
  .apPanel.on { display: block; }
  .apPanel label { display: block; margin: 3px 0; }
  .apPanel .note { color: var(--muted); font-size: 11.5px; margin: 6px 0; }
  .toast { position: fixed; right: 16px; bottom: 32px; background: #2d5d9a; color: #fff; padding: 8px 14px; border-radius: 4px; box-shadow: 0 4px 14px #0008;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 460px; white-space: pre-line; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="bar">
  <span class="title" data-i18n="title"></span>
  <label><span data-i18n="floor"></span> <select id="floorSel"></select></label>
  <button id="prevF" title="[">◀</button><button id="nextF" title="]">▶</button>
  <span class="sep"></span>
  <button id="undo" data-i18n="undo" title="Ctrl+Z"></button><button id="redo" data-i18n="redo" title="Ctrl+Y"></button>
  <span class="sep"></span>
  <button id="openDir" data-i18n="openDir"></button>
  <span id="src" class="src"></span>
  <span class="grow"></span>
  <label id="uiSizeLbl">🔍 <select id="uiSize"></select></label>
  <label title="Language / 語言">🌐 <select id="uiLang"><option value="en">English</option><option value="zh_TW">繁體中文</option></select></label>
  <button id="save" class="primary" data-i18n="save" title="Ctrl+S"></button>
</div>

<div class="main">
  <div class="dock left">
    <h3 data-i18n="palette"></h3>
    <div class="body" id="palette"></div>
    <h3><span data-i18n="eventsH"></span><span class="grow"></span></h3>
    <div class="body grow"><input id="evSearch" type="search" data-i18n-ph="evSearch"><div id="evPal"></div></div>
  </div>

  <div class="center">
    <div class="tools">
      <button data-tool="paint" data-i18n="tPaint" title="B"></button>
      <button data-tool="rect" data-i18n="tRect" title="R"></button>
      <button data-tool="erase" data-i18n="tErase" title="E"></button>
      <button data-tool="select" data-i18n="tSelect" title="V"></button>
      <span class="sep"></span>
      <button id="gridBtn" data-i18n="tGrid" title="G"></button>
      <button id="zoomOut" title="-">−</button><span id="zoomLbl" class="muted"></span><button id="zoomIn" title="+">+</button>
      <span class="sep"></span>
      <button id="safeBtn" data-i18n="tSafe"></button>
      <span style="position:relative"><button id="apBtn" data-i18n="tAuto"></button>
        <div class="apPanel" id="apPanel">
          <b data-i18n="apTitle"></b>
          <label><input type="radio" name="apScope" value="floor" checked> <span data-i18n="apThis"></span></label>
          <label><input type="radio" name="apScope" value="all"> <span data-i18n="apAll"></span></label>
          <hr style="border:none;border-top:1px solid var(--line)">
          <label><input type="radio" name="apMode" value="missing" checked> <span data-i18n="apMissing"></span></label>
          <label><input type="radio" name="apMode" value="all"> <span data-i18n="apReplace"></span></label>
          <label><span data-i18n="apSeed"></span> <input id="apSeed" type="number" value="1" style="width:80px"> <button id="apDice">🎲</button></label>
          <div class="note" data-i18n="apNote"></div>
          <div style="text-align:right"><button id="apCancel" data-i18n="cancel"></button> <button id="apRun" class="primary" data-i18n="apRun"></button></div>
        </div></span>
      <span class="grow"></span>
      <span class="brushInfo"><span data-i18n="brush"></span> <canvas id="brushIcon" width="24" height="24"></canvas> <b id="brushName"></b></span>
    </div>
    <div id="placeBar"><span id="pmText"></span><span class="grow"></span>
      <button id="pmSuggest" data-i18n="pmSuggest"></button><button id="pmAuto" class="primary" data-i18n="pmAuto"></button><button id="pmNext"></button><button id="pmClose" title="✕">✕</button></div>
    <div id="wrap"><canvas id="cv"></canvas></div>
    <div class="bottom"><div class="btabs"><button id="bChecks" class="on"></button><button id="bStory"></button><span class="grow"></span><span class="muted" id="storySum" style="font-size:12px;padding:3px 6px"></span></div><div id="probs"></div></div>
  </div>

  <div class="dock right">
    <h3 data-i18n="inspector"></h3>
    <div class="body grow" id="insp"></div>
  </div>
</div>
<div class="statusbar"><span id="hover"></span><span id="status"></span></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal">
  <header><b data-i18n="saveTitle"></b> <span class="muted" id="saveSub"></span></header>
  <div class="content" id="diffs"></div>
  <footer><span class="grow" id="saveNote"></span><button id="mCancel" data-i18n="cancel"></button><button id="mDownload" data-i18n="download"></button><button id="mWrite" class="primary" data-i18n="writeDisk"></button></footer>
</div></div>

<script src="settings.js"></script>
<script src="stage_bundle.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SPRITE_DIR = '../../../assets/media/sprites/';   // the game's own sprites; a coloured square stands in if they cannot load
const TS = 32;                                          // the game's tile size (manifest "tile")

// ---------------- strings ----------------
const I18N = {
  en: {
    title: 'TOMS Stage Editor', floor: 'Floor', undo: 'Undo', redo: 'Redo', openDir: 'Open project folder…', save: 'Save',
    srcBundle: d => `bundle copy (${d})`, srcLive: 'project folder (live)', openUnsupported: 'This browser cannot open folders. Use Chrome or Edge from http://localhost; Save will download the files instead.',
    palette: 'Palette', eventsH: 'Events', evSearch: 'Find event: id, kind or text', inspector: 'Inspector',
    tPaint: '🖌 Paint', tRect: '▭ Rectangle', tErase: '⌫ Erase', tSelect: '↖ Select / move', tGrid: '# Grid', brush: 'Brush:',
    gTerrain: 'Terrain', gStairs: 'Stairs', gDoors: 'Doors', gKeys: 'Keys', gPlayer: 'Player', gMonsters: 'Monsters', gNpcs: 'NPCs', gItems: 'Items',
    evThisFloor: 'This floor can roll', evAll: 'All events', placedN: n => n ? `✓ ${n}` : '', notDefined: 'not defined in any pool',
    floorPanel: 'Floor', name: 'Name', size: 'Size (w × h)', resize: 'Apply size', connectUp: 'Stairs up to', connectDown: 'Stairs down to',
    rollList: n => `Events this floor can roll (${n})`, rollHint: 'Green = placed on the grid. Click one to paint it.',
    handAuthored: f => `Hand-made boss stage (${f}).`, generated: 'Generated grid: running the generator again would replace hand edits.',
    cell: (x, y) => `Cell ${x}, ${y}`, kindLbl: 'Object', charLbl: 'Legend char', none: 'Floor (empty)', wall: 'Wall',
    hp: 'HP', atk: 'ATK', def: 'DEF', footprint: 'Size', effect: 'Effect', evKind: 'Kind', evPool: 'Pool', evText: 'Text', evFloors: 'Floors that can roll it',
    replaceWith: 'Replace with', clearCell: 'Clear cell', useAsBrush: 'Use as brush',
    probsH: n => `Checks (${n})`, noProbs: 'No problems on this floor.',
    pNoStart: 'No stairs and no player start: the player would appear at the bottom-left corner.', pManyStart: n => `${n} player starts (@); only one is used.`,
    pUnknownChar: (c, x, y) => `Char '${c}' at ${x},${y} has no legend entry.`,
    pEvUndefined: id => `${id} is placed but no pool defines it.`, pEvNotListed: id => `${id} is placed but not in this floor's events list.`,
    pEvDup: (id, n) => `${id} is placed ${n} times; one floor should not repeat an event.`, pEvUnplaced: id => `${id} is in the events list but not placed.`,
    pNoUp: to => `connect.up is ${to} but there is no stairs-up tile.`, pUpNoTarget: 'A stairs-up tile, but connect.up is empty.',
    pNoDown: to => `connect.down is ${to} but there is no stairs-down tile.`, pDownNoTarget: 'A stairs-down tile, but connect.down is empty.',
    pUnreach: n => `${n} object(s) cannot be reached from where the player arrives.`, pFootprint: (id, x, y) => `${id} at ${x},${y} is wider than the free cells next to it.`,
    pBorder: 'The outer edge has open cells.', fixAddList: 'Add to list', fixShow: 'Show',
    hoverCell: (x, y, c, what) => `(${x}, ${y})  '${c}'  ${what}`,
    saveTitle: 'Save changes', saveSub: n => `· ${n} file(s) change`, nothingToSave: 'Nothing to save.', cancel: 'Cancel', download: 'Download files', writeDisk: 'Write to project',
    saveNoteLive: 'Writes into the opened project folder.', saveNoteBundle: 'No project folder is open: Download saves each file; copy them into assets/data.',
    savedN: n => `Saved ${n} file(s) to the project folder.`, downloadedN: n => `Downloaded ${n} file(s).`,
    loadedLive: n => `Loaded ${n} floors from the project folder.`, notProject: 'That folder has no assets/data/story/floors. Pick the TOMS folder.',
    hPaint: (what, n) => `Paint ${what} (${n} cell${n > 1 ? 's' : ''})`, hErase: n => `Erase ${n} cell(s)`, hMove: (what) => `Move ${what}`, hListAdd: id => `Add ${id} to the floor's events list`,
    hResize: (w, h) => `Resize to ${w} × ${h}`, hConnect: (d, v) => `connect.${d} → ${v || '(none)'}`, hName: 'Rename floor',
    autoListed: id => `${id} was added to this floor's events list (it can roll it now).`,
    unsavedLeave: 'You have unsaved changes.',
    lines: (n) => `${n} line(s)`,
    blockedWall: (x, y) => `Can't place it here: wall at ${x}, ${y}.`, blockedObj: (what, x, y) => `Can't place it here: ${what} is at ${x}, ${y}. Erase or move it first.`,
    blockedEdge: "Can't place it here: it would stick out of the map.", blockedN: n => `${n} cell(s) skipped: a wall or another object is in the way.`,
    uiSizeTip: 'Interface size. Keys: Alt + = bigger, Alt + - smaller, Alt + 0 back to settings.js. Default in settings.js.', fromFile: p => `settings.js (${p}%)`,
    tSafe: '◇ Safe cells', tAuto: '🎲 Auto-place events…', apTitle: 'Place events automatically', apThis: 'This floor', apAll: 'All floors (one click)',
    apMissing: 'Only events in the list that are not placed yet', apReplace: 'Move every event to a new random cell', apSeed: 'Seed', apRun: 'Place',
    apNote: 'Events go only on cells the player reaches on the way up without opening optional doors, so a key can never be "spent" on an event. They are spread out, never next to stairs, doors or the start, and only events that fire on a tile are placed. The same seed gives the same result; everything stays editable and undoable.',
    apDone: (n, f, s) => `Placed ${n} event(s) on ${f} floor(s).${s ? `\nSkipped ${s}: see Story.` : ''}`, hAuto: n => `Auto-place ${n} event(s)`,
    apSkipNoCell: (id, f) => `${f}: no safe free cell for ${id}`, apSkipUndef: n => `${n} listed id(s) that no pool defines were left out`,
    bChecks: n => `Checks (${n})`, bStory: n => `Story · all floors (${n})`,
    stFloor: 'Floor', stIn: 'Keys in', stFound: 'Found', stUp: 'Doors on the way up', stOut: 'Keys out', stEv: 'Events', stIss: 'Issues',
    storySum: (e, w) => `${e} blocking · ${w} warnings`, topFloor: 'top floor',

  },
  zh_TW: {
    title: 'TOMS 關卡編輯器', floor: '樓層', undo: '復原', redo: '重做', openDir: '開啟專案資料夾…', save: '儲存',

function problems(d) {

  try { history.replaceState(null, '', '#' + id); } catch (_) {} }
$('floorSel').onchange = () => openFloor($('floorSel').value);
const step = n => { const i = FLOORS.findIndex(f => f.id === cur); openFloor(FLOORS[(i + n + FLOORS.length) % FLOORS.length].id); };
$('prevF').onclick = () => step(-1); $('nextF').onclick = () => step(1);

// ---------------- project folder (File System Access API) ----------------
async function fileIn(dir, path, create) { const parts = path.split('/'); let h = dir;
  for (const p of parts.slice(0, -1)) h = await h.getDirectoryHandle(p, { create: !!create }); return h.getFileHandle(parts.at(-1), { create: !!create }); }
async function readJson(dir, path) { const fh = await fileIn(dir, path); const raw = await (await fh.getFile()).text();
  return { obj: JSON.parse(raw), eol: { crlf: raw.includes('\r\n'), finalNewline: raw.endsWith('\n') } }; }
$('openDir').onclick = async () => {
  if (!window.showDirectoryPicker) return toast(t('openUnsupported'));
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    try { await fileIn(dir, 'assets/data/story/floors/F01.json'); } catch (_) { return toast(t('notProject')); }
    const fresh = [];
    for (const f of BUNDLE.floors) {   // same floor list as the bundle, re-read from disk
      const spec = await readJson(dir, f.specPath), stage = await readJson(dir, f.stagePath);
      fresh.push({ ...f, spec: spec.obj, specEol: spec.eol, stage: stage.obj, stageEol: stage.eol });
    }
    FLOORS = fresh; Object.keys(DOCS).forEach(k => delete DOCS[k]); dirHandle = dir;
    $('src').textContent = t('srcLive'); $('src').classList.add('live');
    openFloor(FLOORS.some(f => f.id === cur) ? cur : FLOORS[0].id); toast(t('loadedLive', fresh.length));
  } catch (e) { if (e.name !== 'AbortError') toast(String(e)); }
};

// ---------------- save ----------------
function changedFiles() {
  const out = [];
  FLOORS.forEach(f => { if (!DOCS[f.id]) return; const d = DOCS[f.id], st = stageText(d), sp = specText(d);
    if (st !== d.origStage) out.push({ path: f.stagePath, text: st, before: d.origStage, id: f.id, kind: 'stage' });
    if (sp !== d.origSpec) out.push({ path: f.specPath, text: sp, before: d.origSpec, id: f.id, kind: 'spec' }); });
  return out;
}
function lineDiff(a, b) {   // a small LCS diff over lines, enough for a grid and a legend
  const A = a.replace(/\r/g, '').split('\n'), B = b.replace(/\r/g, '').split('\n'), n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n || j < m) { if (i < n && j < m && A[i] === B[j]) { out.push(['ctx', A[i]]); i++; j++; } else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) out.push(['add', B[j++]]); else out.push(['del', A[i++]]); }
  // keep only changes and two lines of context around them
  const keep = out.map((x, k) => x[0] !== 'ctx' || out.slice(Math.max(0, k - 2), k + 3).some(y => y[0] !== 'ctx'));
  const res = []; out.forEach((x, k) => { if (keep[k]) res.push(x); else if (res.length && res.at(-1)[1] !== '…') res.push(['ctx', '…']); });
  return res;
}
function openSave() {
  const files = changedFiles(); if (!files.length) return toast(t('nothingToSave'));
  $('saveSub').textContent = t('saveSub', files.length);
  $('diffs').innerHTML = files.map(f => `<div class="file"><div class="path">${esc(f.path)}</div><pre class="diff">${lineDiff(f.before, f.text).map(([c, l]) => `<span class="${c}">${c === 'add' ? '+ ' : c === 'del' ? '- ' : '  '}${esc(l)}</span>`).join('')}</pre></div>`).join('');
  $('mWrite').disabled = !dirHandle; $('saveNote').textContent = dirHandle ? t('saveNoteLive') : t('saveNoteBundle');
  $('modalBg').style.display = 'flex';
}
function markSaved(files) { files.forEach(f => { const d = DOCS[f.id]; if (f.kind === 'stage') d.origStage = f.text; else d.origSpec = f.text; }); renderFloorSel(); }
$('save').onclick = openSave;
$('mCancel').onclick = () => $('modalBg').style.display = 'none';
$('mWrite').onclick = async () => { const files = changedFiles();
  try { for (const f of files) { const fh = await fileIn(dirHandle, f.path, true), w = await fh.createWritable(); await w.write(f.text); await w.close(); }
    markSaved(files); $('modalBg').style.display = 'none'; toast(t('savedN', files.length)); } catch (e) { toast(String(e)); } };
$('mDownload').onclick = () => { const files = changedFiles();
  files.forEach((f, i) => setTimeout(() => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([f.text], { type: 'application/json' }));
    a.download = f.path.split('/').pop(); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, i * 250));
  markSaved(files); $('modalBg').style.display = 'none'; toast(t('downloadedN', files.length)); };

// ---------------- misc ----------------
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('show'), 3200); }
$('undo').onclick = undo; $('redo').onclick = redo;
$('gridBtn').onclick = () => { showGrid = !showGrid; $('gridBtn').classList.toggle('on', showGrid); drawAll(); };
const zoomCenter = factor => { const r = $('wrap').getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, zoom * factor); };
$('zoomIn').onclick = () => zoomCenter(1.25); $('zoomOut').onclick = () => zoomCenter(1 / 1.25);
$('evSearch').oninput = renderEventPalette;
const UI_KEY = 'toms-stage-editor-ui', UI_STEPS = [.75, .9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.25, 2.5];
const fileScale = Math.max(.75, Math.min(2.5, +ES.uiScale || 1));
let uiScale = (() => { try { const v = parseFloat(localStorage.getItem(UI_KEY)); if (v >= .75 && v <= 2.5) return v; } catch (_) {} return fileScale; })();
function applyUiScale() {
  const b = document.body.style; b.zoom = uiScale; b.width = `calc(100vw / ${uiScale})`; b.height = `calc(100vh / ${uiScale})`;
  let fromFile = true; try { fromFile = !localStorage.getItem(UI_KEY); } catch (_) {}
  $('uiSize').innerHTML = `<option value="">${t('fromFile', Math.round(fileScale * 100))}</option>` + UI_STEPS.map(v => `<option value="${v}">${Math.round(v * 100)}%</option>`).join('');
  $('uiSize').value = fromFile ? '' : String(uiScale); $('uiSizeLbl').title = t('uiSizeTip');
}
function setUiScale(v) {   // null = back to settings.js
  try { if (v == null) localStorage.removeItem(UI_KEY); else localStorage.setItem(UI_KEY, String(v)); } catch (_) {}
  uiScale = v == null ? fileScale : v; applyUiScale(); drawAll();
}
$('uiSize').onchange = () => setUiScale($('uiSize').value ? parseFloat($('uiSize').value) : null);
// Mouse wheel over the map: zoom around the cursor, so the cell under the mouse stays put (Ctrl + wheel and a
// trackpad pinch do the same). Shift + wheel keeps the browser's sideways scroll. Positions are measured in
// the map's own CSS pixels (f converts screen pixels when the interface size scales the page).
function zoomAt(clientX, clientY, newZoom) {
  const wrap = $('wrap'), wr = wrap.getBoundingClientRect(), cr = cv.getBoundingClientRect(), f = cv.width / (cr.width || 1);
  const mx = (clientX - wr.left) * f, my = (clientY - wr.top) * f, s0 = Math.round(TS * zoom);
  const u = (wrap.scrollLeft + mx - PAD.x) / s0, v = (wrap.scrollTop + my - PAD.y) / s0;   // map position under the cursor, in cells
  zoom = Math.max(.5, Math.min(4, Math.round(newZoom * 100) / 100)); drawAll();
  const s1 = Math.round(TS * zoom); wrap.scrollLeft = u * s1 + PAD.x - mx; wrap.scrollTop = v * s1 + PAD.y - my;
}
$('wrap').addEventListener('wheel', ev => {
  if (ev.shiftKey && !ev.ctrlKey) return;
  ev.preventDefault(); zoomAt(ev.clientX, ev.clientY, zoom * (ev.deltaY < 0 ? 1.15 : 1 / 1.15));
}, { passive: false });
// pan: right- or middle-mouse drag, or hold Space and drag. A right click that does not move is the eyedropper.
let panDrag = null, spaceDown = false;
$('wrap').addEventListener('contextmenu', ev => ev.preventDefault());
$('wrap').addEventListener('mousedown', ev => {
  if (!(ev.button === 2 || ev.button === 1 || (ev.button === 0 && spaceDown))) return;
  ev.preventDefault(); ev.stopPropagation();
  const f = cv.width / (cv.getBoundingClientRect().width || 1);
  panDrag = { x: ev.clientX, y: ev.clientY, l: $('wrap').scrollLeft, t: $('wrap').scrollTop, f, btn: ev.button, moved: false };
}, true);
addEventListener('mousemove', ev => { if (!panDrag) return; const w = $('wrap');
  if (!panDrag.moved && Math.abs(ev.clientX - panDrag.x) + Math.abs(ev.clientY - panDrag.y) > 4) { panDrag.moved = true; w.classList.add('panning'); }
  if (panDrag.moved) { w.scrollLeft = panDrag.l - (ev.clientX - panDrag.x) * panDrag.f; w.scrollTop = panDrag.t - (ev.clientY - panDrag.y) * panDrag.f; } });
addEventListener('mouseup', ev => { if (!panDrag) return; const p = panDrag; panDrag = null; $('wrap').classList.remove('panning');
  if (p.btn === 2 && !p.moved && cur) { const c = cellAt(ev); if (inGrid(c)) { const sem = semAt(docOf(cur), ...c); if (sem) setBrush(sem); } } });
addEventListener('keydown', ev => { if (ev.key === ' ' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) { ev.preventDefault(); spaceDown = true; $('wrap').classList.add('spacePan'); } });
addEventListener('keyup', ev => { if (ev.key === ' ') { spaceDown = false; $('wrap').classList.remove('spacePan'); } });
addEventListener('blur', () => { spaceDown = false; $('wrap').classList.remove('spacePan'); });
addEventListener('keydown', ev => {
  if (ev.altKey && !ev.ctrlKey && (ev.key === '=' || ev.key === '+' || ev.key === '-' || ev.key === '0')) {   // Alt + = / - / 0: interface size
    ev.preventDefault(); if (ev.key === '0') return setUiScale(null);
    const next = ev.key === '-' ? [...UI_STEPS].reverse().find(v => v < uiScale - 1e-6) : UI_STEPS.find(v => v > uiScale + 1e-6);
    return next ? setUiScale(next) : undefined;
  }
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !ev.ctrlKey) return;
  const k = ev.key.toLowerCase();
  if (ev.ctrlKey && k === 'z') { ev.preventDefault(); undo(); } else if (ev.ctrlKey && k === 'y') { ev.preventDefault(); redo(); }
  else if (ev.ctrlKey && k === 's') { ev.preventDefault(); openSave(); }
  else if (ev.ctrlKey) return;
  else if (k === 'b') setTool('paint'); else if (k === 'r') setTool('rect'); else if (k === 'e') setTool('erase'); else if (k === 'v') setTool('select');
  else if (k === 'g') $('gridBtn').click(); else if (k === '+' || k === '=') $('zoomIn').click(); else if (k === '-') $('zoomOut').click();
  else if (k === '[') step(-1); else if (k === ']') step(1);
  else if (k === 'escape') { selCell = null; $('modalBg').style.display = 'none'; renderInspector(); drawAll(); }
  else if ((k === 'delete' || k === 'backspace') && selCell) edit(t('hErase', 1), dd => dd.grid[selCell[1]][selCell[0]] = '.');
});
addEventListener('beforeunload', ev => { if (FLOORS.some(f => isDirty(f.id))) { ev.preventDefault(); ev.returnValue = t('unsavedLeave'); } });
function applyStatic() {
  document.documentElement.lang = LANG === 'zh_TW' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $('uiLang').value = LANG; if (!dirHandle) $('src').textContent = t('srcBundle', BUNDLE.snapshot);
  if (!window.showDirectoryPicker) $('openDir').title = t('openUnsupported');
}
$('uiLang').onchange = () => { LANG = $('uiLang').value; try { localStorage.setItem(LANG_KEY, LANG); } catch (_) {}
  applyStatic(); applyUiScale(); renderFloorSel(); renderPalette(); renderEventPalette(); renderInspector(); renderProblems(); setBrush(brush); };

applyStatic(); applyUiScale(); setTool('paint'); $('gridBtn').classList.add('on');
openFloor(FLOORS.some(f => f.id === location.hash.slice(1)) ? location.hash.slice(1) : FLOORS[0].id);
setBrush('wall');
(() => {   // ?floor=F02&place=ev_x&kind=whisper&floors=F02,F04 -- opened by the event editor's "+ Add floor…"
  const u = new URLSearchParams(location.search), id = u.get('place'); if (!id) return;
  const floors = (u.get('floors') || u.get('floor') || '').split(',').filter(f => FLOORS.some(x => x.id === f));
  if (!evById[id]) { const e = { id, kind: u.get('kind') || '', pool: '(event editor)', text: id + '.text', pending: true }; BUNDLE.events.push(e); evById[id] = e; }
  placeMode = { id, floors: floors.length ? floors : [cur] };
  openFloor(placeMode.floors[0]); setTool('paint'); setBrush('event:' + id); renderPlaceBar(); drawAll();
})();
</script>
